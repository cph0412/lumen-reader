<!DOCTYPE html>
<html lang="zh-CN" data-theme="paper" data-route="library">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: http:; media-src 'self' blob:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Lumen · 流明阅读</title>

  <link rel="preload" href="./assets/fonts/literata-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="./assets/fonts/literata-latin-wght-italic.woff2" as="font" type="font/woff2" crossorigin />

  <link rel="stylesheet" href="./styles/base.css" />
  <link rel="stylesheet" href="./styles/library.css" />
  <link rel="stylesheet" href="./styles/reader.css" />
  <link rel="stylesheet" href="./styles/vocab.css" />
  <link rel="stylesheet" href="./styles/review.css" />
  <link rel="stylesheet" href="./styles/stats.css" />
  <link rel="stylesheet" href="./styles/settings.css" />
</head>
<body>
  <div id="app" class="app">
    <!-- 自定义标题栏（无边框窗口） -->
    <header class="titlebar" id="titlebar">
      <div class="brand" aria-label="Lumen 流明阅读">
        <span class="brand-mark" aria-hidden="true">L</span>
        <span class="brand-word">Lumen</span>
        <span class="brand-slogan">把每一页，读成自己的语言</span>
      </div>
      <div class="titlebar-center" id="titlebar-center" aria-live="polite"></div>
      <div class="window-controls" id="window-controls">
        <button type="button" class="win-btn" data-win="minimize" aria-label="最小化" title="最小化"></button>
        <button type="button" class="win-btn" data-win="maximize" aria-label="最大化" title="最大化"></button>
        <button type="button" class="win-btn win-close" data-win="close" aria-label="关闭" title="关闭"></button>
      </div>
    </header>

    <div class="app-body">
      <!-- 左侧图标导航（hover 展开） -->
      <aside class="sidebar" id="sidebar" aria-label="主导航">
        <nav class="side-nav" id="side-nav"></nav>
        <div class="side-foot" id="side-foot"></div>
      </aside>

      <!-- 路由内容容器 -->
      <main class="app-main">
        <div class="view" id="view" role="main"></div>
      </main>
    </div>
  </div>

  <div id="toast-stack" class="toast-stack" aria-live="polite"></div>
  <div id="modal-root" class="modal-root"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
